<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1180" width="1520" height="1180" role="img" aria-labelledby="i9714-title i9714-desc">
  <title id="i9714-title">Taxi plugin architecture: component factories</title>
  <desc id="i9714-desc">
    Taxi UI depends on the abstract classes Taxi Finder, Taxi Selector and on Component
    Factories. Taxi Suppliers depends on Taxi Finder, and Taxi Dispatcher depends on both
    Taxi Selector and Taxi Suppliers. Two plugin packages, Rides and Kittens, hold the
    concrete implementations: Ride Finder Impl and Ride Selector Impl implement Taxi Finder
    and Taxi Selector; Kitten Selector Impl, Kitten Supplier Impl and Kitten Dispatcher Impl
    implement Taxi Selector, Taxi Suppliers and Taxi Dispatcher. Component Factories creates
    every concrete implementation, so new plugins can be added without changing the abstract
    classes or Taxi UI.
  </desc>

  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #1a1a1a; stroke-width: 2; }
    .package { fill: none; stroke: #1a1a1a; stroke-width: 2; }
    .name { font: 700 16px Arial, Helvetica, sans-serif; text-anchor: middle; fill: #1a1a1a; }
    .stereotype { font: italic 12px Arial, Helvetica, sans-serif; text-anchor: middle; fill: #1a1a1a; }
    .package-label { font: italic 15px Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .edge { fill: none; stroke: #1a1a1a; stroke-width: 1.5; }
    .creates { fill: none; stroke: #1a1a1a; stroke-width: 1.25; stroke-dasharray: 6 5; }
    .edge-label { font: 12px Arial, Helvetica, sans-serif; fill: #333333; }
    .boundary { stroke: #1a1a1a; stroke-width: 4; }
  </style>

  <defs>
