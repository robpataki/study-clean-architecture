    <text class="name" x="932" y="915">Kitten Selector Impl</text>

    <rect class="box" x="1040" y="880" width="185" height="60" />
    <text class="name" x="1132" y="915">Kitten Supplier Impl</text>

    <rect class="box" x="1240" y="880" width="205" height="60" />
    <text class="name" x="1342" y="915">Kitten Dispatcher Impl</text>
