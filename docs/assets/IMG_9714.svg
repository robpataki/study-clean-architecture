    <line class="boundary" x1="355" y1="20" x2="355" y2="680" />
    <line class="boundary" x1="800" y1="20" x2="800" y2="680" />
    <line class="boundary" x1="815" y1="20" x2="815" y2="680" />
    <line class="boundary" x1="20" y1="682" x2="1500" y2="682" />
    <line class="boundary" x1="20" y1="697" x2="1500" y2="697" />
    <line class="boundary" x1="20" y1="1000" x2="1500" y2="1000" />
    <line class="boundary" x1="20" y1="1015" x2="1500" y2="1015" />
