    <line class="edge" x1="670" y1="878" x2="515" y2="412" marker-end="url(#arrowHollow5)" />
    <line class="edge" x1="932" y1="878" x2="585" y2="412" marker-end="url(#arrowHollow5)" />
    <line class="edge" x1="1132" y1="878" x2="1060" y2="152" marker-end="url(#arrowHollow5)" />
    <line class="edge" x1="1342" y1="878" x2="1030" y2="412" marker-end="url(#arrowHollow5)" />
