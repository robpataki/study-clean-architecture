    <text class="name" x="910" y="1096">Component Factories</text>

    <path class="creates" d="M830,1048 L460,942" marker-end="url(#arrowOpen5)" />
    <path class="creates" d="M865,1048 L670,942" marker-end="url(#arrowOpen5)" />
    <path class="creates" d="M910,1048 L932,942" marker-end="url(#arrowOpen5)" />
    <path class="creates" d="M955,1048 L1132,942" marker-end="url(#arrowOpen5)" />
    <path class="creates" d="M990,1048 L1342,942" marker-end="url(#arrowOpen5)" />
    <text class="edge-label" x="910" y="1010">creates</text>
  </g>
</svg>
