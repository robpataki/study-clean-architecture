    <text class="name" x="150" y="250">Taxi UI</text>

    <rect class="box" x="420" y="60" width="260" height="90" />
    <text class="stereotype" x="640" y="80">«Abstract»</text>
    <text class="name" x="550" y="115">Taxi Finder</text>

    <rect class="box" x="900" y="60" width="260" height="90" />
