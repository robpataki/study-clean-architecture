    </marker>
    <marker id="arrowHollow4" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" />
    </marker>
  </defs>

