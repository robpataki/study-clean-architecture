<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1150" width="1400" height="1150" role="img" aria-labelledby="i9675-title i9675-desc">
  <title id="i9675-title">Figure 22.2: A typical web-based Java system utilizing a database</title>
  <desc id="i9675-desc">
    Controller populates Input Data and calls the Input Boundary interface. Use Case
    Interactor implements Input Boundary, reads Input Data, uses Entities, populates Output
    Data, and calls both the Output Boundary interface and the Data Access Interface.
    Presenter implements Output Boundary, reads Output Data, and populates the View Model,
    which View reads. Data Access implements the Data Access Interface, uses the Database,
    and builds Entities. Two double lines mark architectural boundaries: one separates the
    Controller, Presenter, View Model and the boundary interfaces from the interactor and
    entities; the other separates View, Data Access and Database, the outermost
    frameworks-and-drivers layer, from everything above it.
  </desc>

  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #1a1a1a; stroke-width: 2; }
    .name { font: 700 16px Arial, Helvetica, sans-serif; text-anchor: middle; fill: #1a1a1a; }
    .stereotype { font: italic 12px Arial, Helvetica, sans-serif; text-anchor: middle; fill: #1a1a1a; }
    .edge { fill: none; stroke: #1a1a1a; stroke-width: 1.5; }
    .edge-label { font: 12px Arial, Helvetica, sans-serif; fill: #333333; }
    .boundary { stroke: #1a1a1a; stroke-width: 4; }
    .note { font: italic 12px Arial, Helvetica, sans-serif; fill: #444444; }
  </style>

  <defs>
