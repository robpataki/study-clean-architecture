    <line class="edge" x1="820" y1="360" x2="662" y2="440" marker-end="url(#arrowOpen4)" />
    <text class="edge-label" x="700" y="415">calls</text>

    <line class="edge" x1="820" y1="370" x2="662" y2="610" marker-end="url(#arrowOpen4)" />
    <text class="edge-label" x="700" y="500">populates</text>

    <line class="edge" x1="1060" y1="330" x2="1138" y2="330" marker-end="url(#arrowOpen4)" />
    <text class="edge-label" x="1075" y="320">uses</text>

    <line class="edge" x1="940" y1="380" x2="940" y2="758" marker-end="url(#arrowOpen4)" />
    <text class="edge-label" x="955" y="570">calls</text>

    <line class="edge" x1="280" y1="270" x2="418" y2="440" marker-end="url(#arrowHollow4)" />
    <text class="edge-label" x="387" y="400">implements</text>

    <line class="edge" x1="280" y1="285" x2="418" y2="610" marker-end="url(#arrowOpen4)" />
    <text class="edge-label" x="380" y="540">reads</text>

    <line class="edge" x1="170" y1="310" x2="170" y2="518" marker-end="url(#arrowOpen4)" />
    <text class="edge-label" x="200" y="420">populates</text>

    <line class="edge" x1="170" y1="998" x2="170" y2="592" marker-end="url(#arrowOpen4)" />
