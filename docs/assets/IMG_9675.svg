    <line class="edge" x1="930" y1="998" x2="935" y2="852" marker-end="url(#arrowHollow4)" />
    <text class="edge-label" x="965" y="920">implements</text>

    <line class="edge" x1="1040" y1="1035" x2="1138" y2="1035" marker-end="url(#arrowOpen4)" />
